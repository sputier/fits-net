site_name: FitsNet
site_description: A .NET library to read, write and edit FITS files.
repo_url: https://github.com/sputier/fits-net
docs_dir: docs
site_dir: site
strict: true

theme:
  name: readthedocs

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - toc:
      permalink: false

exclude_docs: |
  examples/
  requirements.txt

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guide:
    - Files and HDUs: files.md
    - Headers: headers.md
    - Images: images.md
    - Tables: tables.md
    - Compression: compression.md
    - Checksums: checksums.md
    - World coordinates: wcs.md
    - Time: time.md
    - Conventions: conventions.md
    - Reliability and limits: reliability.md
    - Standard coverage: standard-coverage.md
  # BEGIN API NAVIGATION
  - API reference:
    - Overview: api/index.md
    - FitsNet:
      - "AsciiTableHdu": api/FitsNet.AsciiTableHdu.md
      - "BinaryTableHdu": api/FitsNet.BinaryTableHdu.md
      - "BitPix": api/FitsNet.BitPix.md
      - "ChecksumPolicy": api/FitsNet.ChecksumPolicy.md
      - "ChecksumResult": api/FitsNet.ChecksumResult.md
      - "ChecksumStatus": api/FitsNet.ChecksumStatus.md
      - "CompressedImageHdu": api/FitsNet.CompressedImageHdu.md
      - "CompressedTableHdu": api/FitsNet.CompressedTableHdu.md
      - "FitsCard": api/FitsNet.FitsCard.md
      - "FitsCardKind": api/FitsNet.FitsCardKind.md
      - "FitsException": api/FitsNet.FitsException.md
      - "FitsFile": api/FitsNet.FitsFile.md
      - "FitsHeader": api/FitsNet.FitsHeader.md
      - "FitsMimeTypes": api/FitsNet.FitsMimeTypes.md
      - "FitsReadOptions": api/FitsNet.FitsReadOptions.md
      - "GenericHdu": api/FitsNet.GenericHdu.md
      - "GreenBankConvention": api/FitsNet.GreenBankConvention.md
      - "Hdu": api/FitsNet.Hdu.md
      - "HeaderInheritance": api/FitsNet.HeaderInheritance.md
      - "ImageHdu": api/FitsNet.ImageHdu.md
