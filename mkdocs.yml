site_name: Eleris.FitsNet
site_description: A .NET library to read, write and edit FITS files.
repo_url: https://github.com/sputier/fits-net
docs_dir: docs
site_dir: site
strict: true

theme:
  name: readthedocs

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - toc:
      permalink: false

exclude_docs: |
  examples/
  requirements.txt

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guide:
    - Files and HDUs: files.md
    - Headers: headers.md
    - Images: images.md
    - Tables: tables.md
    - Compression: compression.md
    - Checksums: checksums.md
    - World coordinates: wcs.md
    - Time: time.md
    - Conventions: conventions.md
    - Reliability and limits: reliability.md
    - Standard coverage: standard-coverage.md
    - Comparison with cfitsio and astropy: comparison.md
  # BEGIN API NAVIGATION
  - API reference:
    - Overview: api/index.md
    - Eleris.FitsNet:
