name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build
        run: dotnet build -c Release
      - name: Test (net8.0 and net10.0, without the astropy comparisons)
        run: dotnet test tests/Eleris.FitsNet.Tests -c Release --no-build
        env:
          FITSNET_SKIP_INTEROP: "1"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt
      - name: Text files use LF (see .gitattributes)
        run: |
          if git ls-files --eol | grep -E "(i|w)/(crlf|mixed)"; then
            echo "::error::Some text files have CRLF or mixed line endings"
            exit 1
          fi
      - name: Build (the guide's examples are compiled with the library)
        run: dotnet build -c Release
      - name: The generated pages are up to date
        run: dotnet run -c Release --no-build --project tools/DocGen -- --check
      - name: Run the examples of the guide
        run: dotnet test tests/Eleris.FitsNet.Tests -c Release --no-build --filter "FullyQualifiedName~DocumentationExamplesTests"
        env:
          FITSNET_SKIP_INTEROP: "1"
      - name: Check the Markdown (format, links, anchors)
        run: python tools/check_docs.py
      - name: Build the site
        run: mkdocs build --strict
      - uses: actions/upload-artifact@v7
        with:
          name: documentation-site
          path: site/
          if-no-files-found: error

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pack
        run: dotnet pack src/Eleris.FitsNet -c Release -o artifacts
      - name: Check the package and use it from a new project (net8.0 and net10.0)
        run: python tools/verify_package.py artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: artifacts/
          if-no-files-found: error

  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy astropy
      - name: Test with the astropy comparisons
        run: dotnet test tests/Eleris.FitsNet.Tests -c Release
