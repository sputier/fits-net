name: Bug report
description: Something does not work, or reads or writes a file wrongly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a **security problem** (a crash on a damaged file, memory use out of proportion), please do not
        open an issue: use the private report described in [SECURITY.md](https://github.com/sputier/fits-net/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happens, and what you expected
      description: The exception with its message and stack trace, or the wrong values.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: The smallest code that shows it, and the smallest FITS file (attach it, or say how to build it). Say which other library reads it the right way, if you know (astropy, cfitsio, ...).
      render: csharp
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Eleris.FitsNet version
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: .NET version and operating system
      placeholder: ".NET 10.0, Windows 11"
    validations:
      required: true
